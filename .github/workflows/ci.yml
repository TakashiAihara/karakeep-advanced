name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# No E2E job on purpose: Playwright drives a real Chromium against two extension
# builds, which costs more than it returns at this repo's size. Run it locally
# with `bun --filter '@karakeep-advanced/tab-group' test:e2e`.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
